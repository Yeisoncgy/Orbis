<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Orbis: la memoria de tus agentes, a la vista. Local, de solo lectura y sin red." />
    <meta name="theme-color" content="#020c1b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/marca.svg" />
    <link rel="apple-touch-icon" href="/marca-180.png" />
    <title>Orbis · La memoria de tus agentes</title>
    <style>
      /* lo primero que se ve, antes de que cargue la app: la marca girando sobre el agua */
      html, body { height: 100%; margin: 0; background: #020c1b; }
      .umbral { height: 100%; display: grid; place-content: center; justify-items: center; gap: 18px; background: radial-gradient(900px 700px at 50% 45%, rgba(0, 150, 200, 0.24), transparent 66%), #010610; color: #e6fbff; font: 500 30px/1 system-ui, sans-serif; letter-spacing: -0.02em; }
      .umbral svg { width: 72px; height: 72px; overflow: visible; filter: drop-shadow(0 0 22px rgba(60, 220, 255, 0.55)); }
      .umbral g { transform-origin: 16px 16px; animation: umbral 2.8s linear infinite; }
      @keyframes umbral { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .umbral g { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="umbral" role="img" aria-label="Orbis está cargando">
        <svg viewBox="0 0 32 32">
          <defs>
            <linearGradient id="umbral-a" x1="5" y1="5" x2="27" y2="27" gradientUnits="userSpaceOnUse"><stop stop-color="#7CFFE1" /><stop offset="1" stop-color="#19C3FF" /></linearGradient>
            <radialGradient id="umbral-h"><stop stop-color="#7CFFE1" stop-opacity=".8" /><stop offset="1" stop-color="#7CFFE1" stop-opacity="0" /></radialGradient>
          </defs>
          <g>
            <path fill="url(#umbral-a)" fill-rule="evenodd" d="M16 3.2a12.8 12.8 0 1 0 0 25.6a12.8 12.8 0 1 0 0-25.6Zm1.06 2.14a9.6 9.6 0 1 1 0 19.2a9.6 9.6 0 1 1 0-19.2Z" />
            <circle cx="24.45" cy="7.55" r="6.4" fill="url(#umbral-h)" />
            <circle cx="24.45" cy="7.55" r="2.9" fill="#fff" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
